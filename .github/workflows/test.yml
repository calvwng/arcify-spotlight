name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build extension
        run: npm run build

      - name: Package and verify exact build contents
        run: |
          npm run zip
          python3 scripts/test-verify-package.py
          python3 scripts/verify-package.py arcify-spotlight.zip dist manifest.json > package-receipt.json

      - name: Upload verified extension package
        uses: actions/upload-artifact@v4
        with:
          name: spotlight-${{ github.sha }}
          path: |
            arcify-spotlight.zip
            package-receipt.json
          if-no-files-found: error
          retention-days: 7

      # # E2E tests disabled — Puppeteer Chrome launch fails in GH Actions
      # - name: Run E2E tests
      #   run: xvfb-run --auto-servernum npm run test:e2e
      #   env:
      #     DISPLAY: ':99'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
