<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Arc controls</title><link rel="stylesheet" href="shared/little-arc-header.css"></head><body>
<main id="header" aria-label="Little Arc controls"><div id="expanded">
<form id="choices"><div id="identity"><span id="heading" title="Temporary Little Arc page">Little Arc</span><strong id="domain">Temporary page</strong></div><select id="space" aria-label="Selected Space" hidden disabled></select>
<div id="split-action"><button id="review" type="submit" disabled>Review destination</button><button id="space-menu-toggle" type="button" aria-label="Choose destination Space" aria-expanded="false" aria-controls="space-picker" disabled>⌄</button></div>
<button id="more" type="button" aria-label="More Little Arc controls" aria-expanded="false" aria-controls="advanced">···</button><button id="dismiss" type="button" aria-label="Collapse Little Arc header" title="Collapse">−</button></form>
<section id="space-picker" aria-label="Destination Spaces" hidden><label class="sr-only" for="space-search">Search Spaces</label><input id="space-search" type="search" placeholder="Search Spaces" role="combobox" aria-autocomplete="list" aria-controls="space-results" aria-expanded="true" autocomplete="off"><div id="space-results" role="listbox" aria-label="Spaces"></div><p id="space-empty" hidden>No matching Spaces.</p></section>
<section id="advanced" aria-label="Advanced Little Arc controls" hidden><label>Window <select id="window" form="choices" required disabled></select></label><div><button id="refresh" type="button" disabled>Refresh choices</button><button id="controls" type="button" disabled>Trusted controls</button><button id="size-settings" type="button" disabled>Window size settings</button></div></section>
<p id="status" role="status" aria-live="polite">Connecting to Little Arc…</p></div><button id="reopen" type="button" hidden>Show Little Arc controls</button></main><script type="module" src="shared/little-arc-header-frame.js"></script></body></html>
